# =============================================================================
# Lawmads Platform — orchestration
#   docker compose up -d --build
# Networks:
#   lawmads-net : app plane (api, web, postgres, redis)
#   judge0-net  : ISOLATED sandbox plane. Judge0 workers live ONLY here — no
#                 route to the app DB/Redis, no shared volumes, ENABLE_NETWORK=false.
#                 judge0-server straddles both nets so the api can submit jobs.
# =============================================================================
name: lawmads

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawmads
      POSTGRES_USER: lawmads
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawmads}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawmads -d lawmads"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lawmads-net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [lawmads-net]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://lawmads:${POSTGRES_PASSWORD:-lawmads}@postgres:5432/lawmads
      REDIS_URL: redis://redis:6379
      EXECUTOR: judge0
      JUDGE0_URL: http://judge0-server:2358
      GRADING_CALLBACK_BASE: http://api:4000
      RUN_MIGRATIONS_ON_START: "true"
    ports: ["4000:4000"]
    # api submits to Judge0 and receives its callbacks → needs a route to the
    # judge0 API server (never to the worker sandboxes).
    networks: [lawmads-net, judge0-net]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { VITE_API_ORIGIN: "" } }
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]
    networks: [lawmads-net]

  # --- Judge0 CE — isolated execution plane -----------------------------------
  judge0-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: judge0, POSTGRES_USER: judge0, POSTGRES_PASSWORD: "${JUDGE0_POSTGRES_PASSWORD:-judge0}" }
    volumes: [judge0-db-data:/var/lib/postgresql/data]
    networks: [judge0-net]

  judge0-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${JUDGE0_REDIS_PASSWORD:-judge0}"]
    networks: [judge0-net]

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    depends_on: [judge0-db, judge0-redis]
    env_file: [./judge0/judge0.conf]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0}
    networks: [judge0-net, lawmads-net]

  judge0-workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    command: ["./scripts/workers"]
    depends_on: [judge0-db, judge0-redis]
    env_file: [./judge0/judge0.conf]
    environment:
      REDIS_HOST: judge0-redis
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-judge0}
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0}
    privileged: true            # isolate needs cgroups
    networks: [judge0-net]      # workers have NO app-plane leg

networks:
  lawmads-net: { driver: bridge }
  judge0-net: { driver: bridge }

volumes:
  db-data:
  redis-data:
  judge0-db-data:
