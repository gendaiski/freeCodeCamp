# Move to <repo root>/.github/workflows/ when Lawmads lives in its own repository.
name: lawmads-ci
on:
  push: { paths: ["lawmads/**"] }
  pull_request: { paths: ["lawmads/**"] }
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: lawmads } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: lawmads_test, POSTGRES_USER: lawmads, POSTGRES_PASSWORD: lawmads }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lawmads" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lawmads/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://lawmads:lawmads@127.0.0.1:5432/lawmads_test
          REDIS_URL: redis://127.0.0.1:6379
          EXECUTOR: local
      - run: npm run build
      - name: Seed a database for the browser smoke
        run: npm run db:migrate && npm run db:seed
        env: { DATABASE_URL: "postgres://lawmads:lawmads@127.0.0.1:5432/lawmads_test", REDIS_URL: "redis://127.0.0.1:6379" }
      - name: Start API and static web
        run: |
          (DATABASE_URL=postgres://lawmads:lawmads@127.0.0.1:5432/lawmads_test REDIS_URL=redis://127.0.0.1:6379 EXECUTOR=local JWT_SECRET=ci JWT_REFRESH_SECRET=ci SERVICE_HMAC_SECRET=ci CERTIFICATE_SIGNING_KEY=ci node --import tsx apps/api/src/index.ts > api.log 2>&1 &)
          (npx vite preview --config apps/web/vite.config.ts apps/web > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:4000/healthz > /dev/null && curl -sf localhost:4173/ > /dev/null && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { E2E_BASE_URL: "http://localhost:4173" }
