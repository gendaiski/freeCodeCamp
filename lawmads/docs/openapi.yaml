openapi: 3.0.3
info:
  title: Lawmads Platform API
  version: 1.0.0
  description: |
    REST API for the Lawmads® Legal Technology Academy: catalogue and learning, the IDE and grading pipeline,
    signed credentials and public verification, commerce, community, the bilingual law database, legal LLM
    models, the Lawyer Work Space and the Web Builder.

    Authentication: `Authorization: Bearer <accessToken>` (JWT, 15 min) obtained from `/auth/login`, rotated with
    `/auth/refresh`. Internal service calls sign the raw body with HMAC-SHA256 (`X-Signature`, `X-Timestamp`).
    Errors always have the shape `{ "error": { "code", "message", "details?" } }`.

    Operations: `GET /healthz` (outside the versioned prefix) returns `{ ok, checks: { postgres, redis }, executor, version }`
    with 503 when Postgres is unavailable.
servers:
  - url: /api/v1
tags:
  - { name: auth }
  - { name: catalog }
  - { name: learning, description: "Per-user learning state under /me" }
  - { name: ide }
  - { name: credentials, description: "Badges, certificates, ladder, public verification" }
  - { name: track-designer }
  - { name: commerce }
  - { name: community }
  - { name: law }
  - { name: ai }
  - { name: builder }
  - { name: workspace }
  - { name: content }
  - { name: admin }
  - { name: ops }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    hmac:
      type: apiKey
      in: header
      name: X-Signature
      description: "`sha256=<hex hmac of raw body>`; requires `X-Timestamp` within ±5 minutes."
  responses:
    BadRequest: { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Not allowed for this principal, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    TooMany: { description: Rate limit or quota exceeded, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_error }
            message: { type: string }
            details: {}
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [student, instructor, admin] } }
        plan: { type: string, example: plan_pro_annual }
        locale: { type: string, enum: [en, ar, fr] }
        academicVerified: { type: boolean }
        totpEnabled: { type: boolean }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: "#/components/schemas/User" }
    Register:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        firstName: { type: string }
        lastName: { type: string }
        academicEmail: { type: string, format: email, nullable: true }
        locale: { type: string, enum: [en, ar, fr] }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp: { type: string, minLength: 6, maxLength: 6 }
    ProgramSummary:
      type: object
      properties:
        code: { type: string, example: LUID }
        slug: { type: string }
        name: { type: string }
        tagline: { type: string }
        track: { type: string }
        level: { type: string }
        weeks: { type: integer }
        techCredits: { type: integer }
        lawCredits: { type: integer }
        sku: { type: string }
        priceCents: { type: integer }
        kind: { type: string, enum: [certification, diploma, career] }
        featured: { type: boolean }
        isNew: { type: boolean }
    CurriculumItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [video, reading, lab, quiz, capstone] }
        title: { type: string }
        minutes: { type: integer, nullable: true }
        lessonId: { type: string, nullable: true, description: lesson slug }
        quizId: { type: string, nullable: true, description: quiz slug }
        exerciseId: { type: string, nullable: true, description: exercise slug }
        status: { type: string, enum: [locked, now, done, open], nullable: true }
    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          properties:
            overview: { type: string }
            whoFor: { type: array, items: { type: string } }
            careerOutcomes: { type: array, items: { type: string } }
            capstone: { type: string }
            assessment: { type: string }
            installments: { type: object, properties: { count: { type: integer }, cents: { type: integer } } }
            tracks:
              type: array
              items:
                type: object
                properties:
                  code: { type: string }
                  name: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/CurriculumItem" } }
            enrolled: { type: boolean }
            progressPct: { type: number }
    Exercise:
      type: object
      properties:
        id: { type: string, example: python-1, description: slug }
        language: { type: string }
        title: { type: string }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        credits: { type: integer }
        prompt_md: { type: string }
        starter_code: { type: string }
        grading: { type: string, enum: [output, structural] }
        checks: { type: array, items: { type: string } }
        sample_tests: { type: array, items: { type: object, properties: { name: { type: string }, input: { type: string }, expected: { type: string } } } }
        hidden_test_count: { type: integer }
        hints_available: { type: integer }
        reveal_solution_after: { type: integer }
        mine: { type: object, nullable: true, properties: { attempts: { type: integer }, best_score: { type: number }, completed: { type: boolean } } }
    RunRequest:
      type: object
      required: [exerciseId, code]
      properties:
        exerciseId: { type: string }
        code: { type: string, maxLength: 200000 }
        stdin: { type: string, maxLength: 20000 }
    RunResult:
      type: object
      properties:
        status: { type: string, enum: [graded, error, timeout, compile_error] }
        stdout: { type: string }
        stderr: { type: string }
        compile_output: { type: string }
        time_ms: { type: integer }
        memory_kb: { type: integer, nullable: true }
        message: { type: string, nullable: true }
    SubmissionAccepted:
      type: object
      properties:
        submissionId: { type: string, format: uuid }
        status: { type: string, enum: [queued, graded] }
    Submission:
      type: object
      properties:
        id: { type: string, format: uuid }
        exercise_slug: { type: string }
        exercise_title: { type: string }
        kind: { type: string, enum: [run, submit] }
        status: { type: string, enum: [queued, running, graded, error] }
        score: { type: number }
        passed: { type: boolean }
        runtime_ms: { type: integer }
        detail:
          type: object
          properties:
            tests: { type: array, items: { type: object, properties: { name: { type: string }, hidden: { type: boolean }, passed: { type: boolean }, status: { type: string }, expected: { type: string, description: "omitted for hidden tests" }, actual: { type: string } } } }
            stderr: { type: string }
            compile_output: { type: string }
        credits: { type: integer, description: credits awarded by this submission }
        solutionUnlocked: { type: boolean }
        created_at: { type: string, format: date-time }
        graded_at: { type: string, format: date-time, nullable: true }
    Quote:
      type: object
      required: [sku]
      properties:
        sku: { type: string, example: certificate }
        ref: { type: string, nullable: true, description: "program code / jurisdiction for certificate & badge SKUs" }
        quantity: { type: integer, minimum: 1, maximum: 500 }
        promo: { type: string, nullable: true, example: DELTA30 }
        installments: { type: boolean }
    QuoteResult:
      type: object
      properties:
        sku: { type: string }
        name: { type: string }
        listCents: { type: integer }
        discountCents: { type: integer }
        discountLabel: { type: string, nullable: true, example: "Verified student rate" }
        totalCents: { type: integer }
        dueTodayCents: { type: integer }
        installments: { type: object, nullable: true, properties: { count: { type: integer }, cents: { type: integer }, feeCents: { type: integer } } }
    Checkout:
      allOf:
        - $ref: "#/components/schemas/Quote"
        - type: object
          properties:
            card: { type: object, nullable: true, properties: { number: { type: string }, expiry: { type: string }, cvc: { type: string }, name: { type: string } } }
            paymentMethodId: { type: string, nullable: true, description: Stripe payment method }
    Verification:
      type: object
      properties:
        verificationId: { type: string, example: LWM-2026-0342 }
        kind: { type: string, enum: [certificate, badge] }
        holder: { type: string }
        program: { type: string, nullable: true }
        programName: { type: string, nullable: true }
        jurisdiction: { type: string, nullable: true }
        score: { type: number, nullable: true }
        issuedAt: { type: string, format: date-time }
        signatureValid: { type: boolean }
        revoked: { type: boolean }
        revokedReason: { type: string, nullable: true }
        ladder: { type: string, nullable: true, example: Regional Lawmad }
        badges: { type: array, items: { type: object } }
        qrDataUrl: { type: string }
    LawSearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              jurisdiction: { type: string }
              jurisdiction_name: { type: string }
              instrument: { type: string }
              instrument_ar: { type: string }
              kind: { type: string }
              article: { type: string }
              text_en: { type: string }
              text_ar: { type: string }
              source_ref: { type: string, nullable: true }
              rank: { type: number }
        total: { type: integer }
        query: { type: string }
        language: { type: string, enum: [en, ar] }
        engine: { type: string }
    Generate:
      type: object
      required: [model, prompt]
      properties:
        model: { type: string, example: lawmad-precedent }
        prompt: { type: string, maxLength: 20000 }
        language: { type: string, enum: [en, ar, fr] }
        jurisdiction: { type: string, maxLength: 2 }
        context: { type: object }
    Generation:
      type: object
      properties:
        id: { type: string, format: uuid }
        model: { type: string }
        text: { type: string }
        citations: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, instrument: { type: string }, article: { type: string } } } }
        confidence: { type: number }
        provider: { type: string }
        supervision: { type: object, properties: { humanReview: { type: boolean }, notice: { type: string } } }
        latencyMs: { type: integer }
    Clause:
      type: object
      required: [id, heading, text_en, text_ar]
      properties:
        id: { type: string }
        heading: { type: string }
        text_en: { type: string }
        text_ar: { type: string }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        governingLaw: { type: string }
        languageMode: { type: string, enum: [en, ar, bi] }
        version: { type: integer }
        content: { type: array, items: { $ref: "#/components/schemas/Clause" } }
        authorities: { type: array, items: { type: object } }
        versions: { type: array, items: { type: object, properties: { version: { type: integer }, created_at: { type: string } } } }
        updated_at: { type: string, format: date-time }

paths:
  /openapi.yaml:
    get: { tags: [ops], summary: This document, responses: { "200": { description: YAML } } }

  # ---------------------------------------------------------------- auth
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account and open a session
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Register" } } } }
      responses:
        "201": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Email already registered }
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in (30/min/IP; 10 failures per account per 15 min → 429)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Login" } } } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { description: "Invalid credentials, or code `totp_required`" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token (single use)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } } }
      responses:
        "200": { description: New session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } } }
      responses: { "204": { description: Revoked } }
  /auth/sso:
    post:
      tags: [auth]
      summary: Exchange a Phase-1 WordPress SSO JWT for a native session
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sso], properties: { sso: { type: string } } } } } }
      responses:
        "200": { description: Session, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/session:
    post:
      tags: [auth]
      summary: Phase-1 alias of /auth/sso
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sso], properties: { sso: { type: string } } } } } }
      responses: { "200": { description: Session } }
  /auth/me:
    get:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Current user
      responses: { "200": { description: User, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } } }
    patch:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Update profile
      requestBody: { content: { application/json: { schema: { type: object, properties: { firstName: { type: string }, lastName: { type: string }, locale: { type: string, enum: [en, ar, fr] }, preferences: { type: object }, academicEmail: { type: string, nullable: true } } } } } }
      responses: { "200": { description: User } }
  /auth/password:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Change password
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current, next], properties: { current: { type: string }, next: { type: string, minLength: 8 } } } } } }
      responses: { "204": { description: Changed }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /auth/2fa/setup:
    post: { tags: [auth], security: [{ bearer: [] }], summary: "Create a TOTP secret (returns otpauth URI + QR)", responses: { "200": { description: "{ secret, otpauth, qrDataUrl }" } } }
  /auth/2fa/enable:
    post:
      tags: [auth]
      security: [{ bearer: [] }]
      summary: Enable 2FA with a valid code
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, minLength: 6, maxLength: 6 } } } } } }
      responses: { "204": { description: Enabled }, "400": { $ref: "#/components/responses/BadRequest" } }
  /auth/2fa/disable:
    post: { tags: [auth], security: [{ bearer: [] }], summary: Disable 2FA, responses: { "204": { description: Disabled } } }
  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      summary: Build the Google / Microsoft authorisation URL
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [google, microsoft] } }]
      responses: { "200": { description: "{ url } or { configured: false }" } }

  # ---------------------------------------------------------------- catalog
  /catalog/tracks:
    get: { tags: [catalog], summary: Tracks, responses: { "200": { description: "{ tracks[] }" } } }
  /catalog/programs:
    get:
      tags: [catalog]
      summary: Programs (26)
      parameters: [{ name: track, in: query, schema: { type: string } }, { name: kind, in: query, schema: { type: string } }]
      responses: { "200": { description: "{ programs[] }", content: { application/json: { schema: { type: object, properties: { programs: { type: array, items: { $ref: "#/components/schemas/ProgramSummary" } } } } } } } }
  /catalog/programs/{code}:
    get:
      tags: [catalog]
      summary: Program detail with curriculum; includes enrolment/progress when authenticated
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Program, content: { application/json: { schema: { $ref: "#/components/schemas/ProgramDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /catalog/courses:
    get: { tags: [catalog], summary: Courses (17), responses: { "200": { description: "{ courses[] }" } } }
  /catalog/courses/{slug}:
    get:
      tags: [catalog]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Course with modules and enrolment state }, "404": { $ref: "#/components/responses/NotFound" } }
  /catalog/lessons/{slug}:
    get:
      tags: [catalog]
      summary: Lesson body (markdown) with prev/next; progress when authenticated
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Lesson }, "404": { $ref: "#/components/responses/NotFound" } }
  /catalog/quizzes/{slug}:
    get:
      tags: [catalog]
      summary: Quiz questions (answers withheld)
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Quiz } }
  /catalog/stats:
    get: { tags: [catalog], summary: Home-page numbers (data-driven), responses: { "200": { description: "{ jurisdictions, languages, programs, exercises, members, ... }" } } }

  # ---------------------------------------------------------------- learning (/me)
  /me/dashboard:
    get: { tags: [learning], security: [{ bearer: [] }], summary: Dashboard aggregate, responses: { "200": { description: "{ user, credits, streak, jurisdictions, ladder, programs[], jumpBackIn[], certificates[], badges[], rank }" } } }
  /me/transcript:
    get: { tags: [learning], security: [{ bearer: [] }], summary: Credit ledger grouped by program and half, responses: { "200": { description: Transcript } } }
  /me/week:
    get: { tags: [learning], security: [{ bearer: [] }], summary: This week's plan, responses: { "200": { description: "{ days[] }" } } }
  /me/enrollments:
    post:
      tags: [learning]
      security: [{ bearer: [] }]
      summary: Enrol in a program (free access; paid programs enrol via checkout)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [programCode], properties: { programCode: { type: string } } } } } }
      responses: { "201": { description: Enrolment }, "402": { description: Payment required } }
  /me/courses/{slug}/enroll:
    post:
      tags: [learning]
      security: [{ bearer: [] }]
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses: { "201": { description: Enrolment } }
  /me/items/{id}/complete:
    post:
      tags: [learning]
      security: [{ bearer: [] }]
      summary: Mark a curriculum item complete (awards credits once)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: "{ creditsAwarded, next }" } }
  /me/quizzes/{slug}/attempts:
    post:
      tags: [learning]
      security: [{ bearer: [] }]
      summary: Submit answers; pass mark 80 %
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answers], properties: { answers: { type: object, additionalProperties: { type: string, maxLength: 1 } } } } } } }
      responses: { "200": { description: "{ scorePct, passed, creditsAwarded, review[] }" } }

  # ---------------------------------------------------------------- ide
  /ide/languages:
    get: { tags: [ide], summary: "19 tracks with exercise counts and per-user progress", responses: { "200": { description: "{ languages[], counts }" } } }
  /ide/exercises:
    get:
      tags: [ide]
      parameters: [{ name: language, in: query, schema: { type: string } }]
      responses: { "200": { description: "{ exercises[] }", content: { application/json: { schema: { type: object, properties: { exercises: { type: array, items: { $ref: "#/components/schemas/Exercise" } } } } } } } }
  /ide/exercises/{id}:
    get:
      tags: [ide]
      parameters: [{ name: id, in: path, required: true, schema: { type: string }, description: slug }]
      responses: { "200": { description: Exercise, content: { application/json: { schema: { $ref: "#/components/schemas/Exercise" } } } }, "404": { $ref: "#/components/responses/NotFound" } }
  /ide/exercises/{id}/hint:
    get:
      tags: [ide]
      security: [{ bearer: [] }]
      summary: Next hint (progressive)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: n, in: query, schema: { type: integer } }]
      responses: { "200": { description: "{ hint, index, total }" } }
  /ide/exercises/{id}/solution:
    get:
      tags: [ide]
      security: [{ bearer: [] }]
      summary: Reference solution — only after `reveal_solution_after` failed attempts or completion
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: "{ solution_code }" }, "403": { description: Locked } }
  /ide/run:
    post:
      tags: [ide]
      security: [{ bearer: [] }]
      summary: Execute with stdin, unjudged (60/min/user; free-tier runtime quota)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunRequest" } } } }
      responses: { "200": { description: Result, content: { application/json: { schema: { $ref: "#/components/schemas/RunResult" } } } }, "429": { $ref: "#/components/responses/TooMany" } }
  /ide/submissions:
    post:
      tags: [ide]
      security: [{ bearer: [] }]
      summary: Submit for grading (async; poll GET /ide/submissions/{id})
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [exerciseId, code], properties: { exerciseId: { type: string }, code: { type: string } } } } } }
      responses: { "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/SubmissionAccepted" } } } } }
  /ide/submissions/{id}:
    get:
      tags: [ide]
      security: [{ bearer: [] }]
      summary: Submission state and graded detail (owner or staff)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Submission, content: { application/json: { schema: { $ref: "#/components/schemas/Submission" } } } }
        "400": { description: Malformed identifier }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ide/judge0/callback:
    put:
      tags: [ide]
      summary: Judge0 result callback (token-validated; status-guarded finalisation)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { token: { type: string }, status: { type: object }, stdout: { type: string }, stderr: { type: string }, compile_output: { type: string }, time: { type: string }, memory: { type: integer } } } } } }
      responses: { "200": { description: Recorded }, "400": { description: Unknown token } }
    post:
